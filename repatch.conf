# Repatch configuration, sourced by all scripts in scripts/.

# Upstream repository and branch to fork.
UPSTREAM_REPO="https://github.com/owner/project.git"
UPSTREAM_BRANCH="main"

# Directory name of the upstream clone below work/ (default: repository name).
NAME=""

# Branch in the upstream clone that holds the applied patches.
PATCHED_BRANCH="patched"

# Build command, run inside the upstream clone. Leave empty to skip building.
BUILD_COMMAND="./gradlew build"

# Build output relative to the upstream clone, uploaded as CI artifact.
BUILD_ARTIFACTS="build/libs/*.jar"
